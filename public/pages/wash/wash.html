<!-- FILE: /public/pages/wash/wash.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wash</title>

    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/modules/wash.css?v=2" />
  </head>

  <body>
    <div id="appHeader"></div>

    <main class="wash-shell">
      <section class="page-section">
        <h1>Wash Team</h1>

        <p>
          Work queue: pending, rewash requested, and washing. Wash team can
          start, complete, or remove vehicles from wash.
        </p>
        <div class="wash-tabs">
          <a href="/pages/wash/wash.html" class="active"> Active </a>

          <a href="/pages/wash-history/wash-history.html"> History </a>

          <a id="washSettingsTab" href="#wash-settings" hidden> Settings </a>
        </div>
      </section>

      <section class="page-section">
        <div class="form-row">
          <strong>Current:</strong>

          <span id="isOpenBadge"> Loading... </span>
        </div>

        <div id="crewDayControl" class="form-row" hidden>
          <button id="openWashBtnCrew" type="button">Open Wash Day</button>
          <button id="closeWashBtnCrew" type="button">Close Wash Day</button>
        </div>

        <div id="washHoursPanel" hidden>
          <h2>Wash Day Control</h2>

          <div class="form-row">
            <button id="openWashBtn" type="button">Open Wash Day</button>
            <button id="closeWashBtn" type="button">Close Wash Day</button>
          </div>

          <div class="form-row">
            <label>
              <input id="crewCanControlDay" type="checkbox" />
              Let wash crew open and close the day
            </label>
          </div>

          <div class="form-row">
            <label>
              <input id="autoFollowHours" type="checkbox" />
              Open automatically from shop hours
            </label>
          </div>

          <div class="form-row">
            <label>Weekday open <input id="mfOpen" type="time" /></label>
            <label>Weekday close <input id="mfClose" type="time" /></label>
            <label>Saturday open <input id="satOpen" type="time" /></label>
            <label>Saturday close <input id="satClose" type="time" /></label>
            <label>Sunday open <input id="sunOpen" type="time" /></label>
            <label>Sunday close <input id="sunClose" type="time" /></label>
            <button id="saveHoursBtn" type="button" disabled>Save shop hours</button>
          </div>
        </div>
      </section>

      <section class="page-section">
        <div id="msg" class="small-muted"></div>

        <div class="wash-table-wrap">
          <table class="wash-table">
            <thead>
              <tr>
                <th>Tag</th>
                <th>RO</th>
                <th>Model</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Need By</th>
                <th>Projected</th>
                <th>Status</th>
                <th>Dropped Off</th>
                <th>Dropped By</th>
                <th>Started</th>
                <th>Notes</th>
                <th>Start</th>
                <th>Done</th>
                <th>Remove</th>
              </tr>
            </thead>

            <tbody id="washRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/js/modules/wash/wash-page.js"></script>
  </body>
</html>
