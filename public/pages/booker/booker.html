<!-- FILE: /public/pages/booker/booker.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booker</title>
    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/modules/booker.css?v=1" />
  </head>
  <body>
    <div id="appHeader"></div>

    <main class="booker-shell">
      <section class="page-section">
        <h1>Booker</h1>
        <p>After Tech Done. Book CP or WTY any time. Request QC or mark no QC needed.</p>

        <div class="booker-tabs" id="bookerTabs">
          <button type="button" data-tab="open" disabled>Tech Done (0)</button>
          <button type="button" data-tab="qc" disabled>QC pending (0)</button>
          <button type="button" data-tab="booked" disabled>Booked (0)</button>
        </div>
      </section>

      <section class="page-section">
        <div id="msg" class="small-muted"></div>

        <div class="form-row">
          <label for="bookerSearchInput">Search:</label>
          <input
            id="bookerSearchInput"
            type="text"
            placeholder="Tag, RO, or vehicle..."
          />
        </div>

        <div class="booker-table-wrap">
          <table class="booker-table">
            <thead>
              <tr>
                <th>Tag</th>
                <th>RO</th>
                <th>Vehicle</th>
                <th>Advisor</th>
                <th>Tech</th>
                <th>QC</th>
                <th>CP</th>
                <th>WTY</th>
                <th>QC action</th>
              </tr>
            </thead>
            <tbody id="bookerTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/js/modules/booker/booker-page.js?v=3"></script>
  </body>
</html>
