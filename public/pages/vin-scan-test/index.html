<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scan VIN</title>
    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <style>
        body.scanner-on {
            background: transparent;
        }
        body.scanner-on #appHeader,
        body.scanner-on .page-shell {
            display: none;
        }
        .cross {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }
        body.scanner-on .cross {
            display: block;
        }
        .cross .v,
        .cross .h {
            position: absolute;
            background: #1E40AF;
        }
        .cross .v {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            transform: translateX(-1.5px);
        }
        .cross .h {
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            transform: translateY(-1.5px);
        }
        .rescan-wrap {
            display: none;
            margin-top: 16px;
        }
        body.failed .rescan-wrap {
            display: block;
        }
        .scan-back {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 30;
            background: #1E40AF;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 16px;
        }
        body.scanner-on .scan-back {
            display: block;
        }
        #rescanBtn {
            font-size: 18px;
            padding: 12px 18px;
        }
    </style>
</head>
<body>
    <div id="appHeader"></div>
    <div class="cross" id="cross">
        <div class="v"></div>
        <div class="h"></div>
    </div>
    <button id="scanBackBtn" type="button" class="scan-back">Back</button>
    <main class="page-shell">
        <div class="page-card">
            <div class="page-title-row">
                <h2>Scan VIN</h2>
            </div>
            <div class="rescan-wrap">
                <button id="rescanBtn" type="button">Rescan</button>
            </div>
        </div>
    </main>
    <script type="module" src="/js/modules/loaners/vin-scan-native.js?v=3"></script>
</body>
</html>
