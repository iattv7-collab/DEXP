<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scan VIN</title>
    <link rel="stylesheet" href="/css/core/reset.css" />
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Arial, sans-serif; }
        .top {
            position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            height: 56px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; background: #e36b12; color: #fff;
        }
        .top button { background: none; border: 0; color: #fff; font-size: 22px; }
        .top h1 { margin: 0; font-size: 18px; font-weight: 600; }
        #scannerVideo {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            object-fit: cover; background: #000; z-index: 1;
        }
        .cross {
            position: fixed; inset: 56px 0 72px 0; z-index: 10; pointer-events: none;
        }
        .cross .v, .cross .h {
            position: absolute; background: #e10600;
            animation: flash 0.7s steps(1) infinite;
        }
        .cross .v { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
        .cross .h { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-1px); }
        .cross.locked .v, .cross.locked .h { animation: none; background: #2ecc40; }
        @keyframes flash { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
        .bottom {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            height: 72px; background: #5a5a5a; display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px;
        }
        #vinOut { font-size: 20px; letter-spacing: 0.5px; }
        #status { position: fixed; top: 64px; left: 0; right: 0; z-index: 15; text-align: center; font-size: 16px; }
    </style>
</head>

<body>
    <div class="top">
        <button id="backBtn" type="button">←</button>
        <h1>Scan VIN</h1>
        <span></span>
    </div>

    <video id="scannerVideo" playsinline muted autoplay></video>
    <div class="cross" id="cross"><div class="v"></div><div class="h"></div></div>
    <p id="status">Point at the VIN</p>

    <div class="bottom">
        <div id="vinOut">VIN Number</div>
        <button id="clearBtn" type="button" style="background:none;border:0;color:#fff;font-size:28px;">×</button>
    </div>

    <script>
        document.getElementById("backBtn").addEventListener("click", () => {
            location.href = "/pages/dashboard/index.html";
        });
    </script>
    <script type="module" src="/js/modules/loaners/vin-scan-test.js?v=23"></script>
</body>

</html>
