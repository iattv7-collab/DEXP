<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIN Scan Test</title>
    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
</head>

<body>
    <main class="page-shell">
        <button id="backBtn" type="button" style="margin:12px 0;padding:10px 16px;font-size:16px;">Back</button>
        <h1>VIN Scan Test</h1>
        <p>Barcode first, then sharpened plate, then the current scanner. Does not change Loaner Returns or Courtesy
            Wash.</p>

        <button id="scanBtn" type="button">Scan VIN</button>

        <video id="scannerVideo" playsinline muted style="display:none;"></video>

        <p id="status"></p>
        <p id="result" style="font-size:1.4rem;font-weight:700;"></p>
        <p id="how"></p>
    </main>

    <script>
        document.getElementById("backBtn").addEventListener("click", () => {
            location.href = "/pages/dashboard/index.html";
        });
    </script>

    <script type="module" src="/js/modules/loaners/vin-scan-test.js?v=15"></script>
</body>

</html>
