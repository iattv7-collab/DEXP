<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VIN</title>
    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <style>
        #vinOut {
            font-size: 26px;
            font-weight: bold;
            color: #1E40AF;
            letter-spacing: 1.4px;
            line-height: 1.3;
            word-break: break-all;
            margin: 8px 0 12px;
        }
        .checksum-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            border-radius: 999px;
            padding: 4px 10px;
            margin-bottom: 8px;
        }
        .checksum-ok {
            background: #dcfce7;
            color: #166534;
        }
        .checksum-bad {
            background: #fee2e2;
            color: #991b1b;
        }
        .checksum-missing {
            background: #e2e8f0;
            color: #475569;
        }
        .vin-decode {
            margin: 16px 0 0;
            padding-top: 8px;
            border-top: 2px solid #1E40AF;
        }
        .vin-decode dt {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 12px;
        }
        .vin-decode dd {
            margin: 2px 0 0;
            color: #1e293b;
            font-weight: 600;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="appHeader"></div>
    <main class="page-shell">
        <div class="page-card">
            <div class="page-title-row">
                <h2>VIN</h2>
            </div>
            <div id="vinOut"></div>
            <div id="checksumBadge" class="checksum-badge"></div>
            <dl id="vinDecode" class="vin-decode"></dl>
            <div class="action-row">
                <button id="useVinBtn" type="button">Use this VIN</button>
                <button id="scanAgainBtn" type="button">Scan again</button>
            </div>
        </div>
    </main>
    <script type="module" src="/js/modules/loaners/vin-scan-result.js?v=1"></script>
</body>
</html>
