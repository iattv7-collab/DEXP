<!-- FILE: /public/pages/advisor/advisor.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Advisor</title>

    <link rel="stylesheet" href="/css/core/reset.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/components/date-time-picker.css?v=1" />
    <link rel="stylesheet" href="/css/modules/advisor.css?v=1" />

  </head>

  <body>
    <div id="appHeader"></div>

    <main id="advisorPage" class="advisor-shell"></main>
      <section class="page-section">
        <h1>Advisor</h1>

        <p>
          Current repair orders, internal status, and advisor follow-through
          actions.
        </p>
      </section>

      <section class="page-section">
        <div id="msg" class="small-muted"></div>

        <div
          class="form-row"
          style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"
        >
          <button id="myRosBtn" type="button">My ROs</button>

          <button id="allRosBtn" type="button">All ROs</button>

          <label for="advisorFilter">Advisor:</label>

          <select id="advisorFilter">
            <option value="">Select Advisor</option>
          </select>

          <label for="searchInput">Search:</label>

          <input
            id="searchInput"
            type="text"
            placeholder="Tag, RO, customer, or advisor..."
          />
        </div>

        <div
          id="advisorViewLabel"
          class="small-muted"
          style="margin-top: 10px; font-weight: bold"
        ></div>

        <div class="table-wrap" style="margin-top: 10px">
          <table id="ticketsTable" class="data-table"></table>
        </div>
      </section>
    </main>

    <script type="module" src="/js/modules/advisor/advisor-page.js"></script>
  </body>
</html>
