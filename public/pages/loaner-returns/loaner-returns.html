<!-- public/pages/loaner-returns/loaner-returns.html -->

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Loaner Returns</title>

  <link rel="stylesheet" href="/css/core/reset.css" />
  <link rel="stylesheet" href="/css/core/base.css" />

  <link rel="stylesheet" href="/css/modules/loaners-shared.css?v=4" />

  <link rel="stylesheet" href="/css/modules/loaner-returns.css?v=3" />
  <style>
    #fuelEntryWrap[data-mode="range"] #fuelTankSelect {
      display: none !important;
    }

    #fuelEntryWrap[data-mode="fuel"] #fuelLevel {
      display: none !important;
    }

    .fuel-mode-toggle button {
      background: #fff !important;
      color: #123a73 !important;
      border: 1px solid #123a73 !important;
    }

    .fuel-mode-toggle button.is-on {
      background: #123a73 !important;
      color: #fff !important;
    }

    .fuel-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .fuel-row .fuel-mode-toggle {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .fuel-row .fuel-level {
      flex: 1;
      min-width: 0;
    }

    .fuel-row .fuel-level select,
    .fuel-row .fuel-level input {
      width: 100%;
    }

    .damage-toggle {
      display: flex;
      gap: 4px;
    }

    .damage-toggle button {
      flex: 1;
      padding: 8px 6px;
      background: #fff;
      color: #123a73;
      border: 1px solid #123a73;
      border-radius: 8px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
    }

    .damage-toggle button.is-on {
      background: #123a73;
      color: #fff;
    }

    .needs-data {
      background: #fff3bf !important;
    }

    .damage-toggle.needs-data button {
      background: #fff3bf !important;
    }

    #fuelLevel::-webkit-outer-spin-button,
    #fuelLevel::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .form-grid select,
    .form-grid textarea,
    .dexp-admin-card>label input {
      padding: 8px 10px;
      border: 1px solid #a0bcdf;
      border-radius: 8px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
    }

    .return-scan-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .return-scan-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #a0bcdf;
      border-radius: 8px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
    }

    .return-scan-row button {
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .return-phone-hide {
        display: none;
      }

      #loanerReturnsPage .page-section {
        margin-bottom: 8px;
      }

      #loanerReturnsPage .dexp-admin-card {
        padding: 8px;
      }

      #loanerReturnsPage .dexp-admin-card h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }

      #loanerReturnsPage .page-shell,
      #loanerReturnsPage {
        padding-left: 8px;
        padding-right: 8px;
      }

      #loanerReturnsPage .form-grid {
        grid-template-columns: 1fr 1fr;
        gap: 6px 8px;
        margin-top: 6px;
      }

      #loanerReturnsPage .form-grid label {
        font-size: 15px;
        font-weight: 700;
        gap: 2px;
      }

      #loanerReturnsPage .form-grid input,
      #loanerReturnsPage .form-grid select,
      #loanerReturnsPage .form-grid textarea {
        font-size: 16px;
        font-weight: 700;
        padding: 6px 8px;
        min-height: 40px;
        min-width: 0;
        max-width: 100%;
        width: 100%;
        box-sizing: border-box;
      }

      #loanerReturnsPage .damage-toggle button,
      #loanerReturnsPage .fuel-mode-toggle button {
        font-size: 15px;
        font-weight: 700;
      }

      #loanerReturnsPage .return-scan-row {
        flex-direction: row;
        gap: 4px;
      }

      #loanerReturnsPage .return-scan-row button {
        min-height: 36px;
        font-size: 14px;
        padding: 6px 8px;
      }

      #loanerReturnsPage .return-scan-row input {
        min-height: 36px;
        font-size: 14px;
      }

      #loanerReturnsPage .action-row {
        margin-top: 8px;
      }

      #loanerReturnsPage .action-row button {
        width: 100%;
        min-height: 40px;
        font-size: 16px;
      }

      #loanerReturnsPage textarea {
        min-height: 32px;
      }

      /* Hide Returned at and Received by on mobile (still saved by the page) */
      #loanerReturnsPage .form-grid label:nth-child(4),
      #loanerReturnsPage .form-grid label:nth-child(5) {
        display: none;
      }

      /* VIN full width */
      #loanerReturnsPage .form-grid label:nth-child(1) {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <div id="appHeader"></div>

  <main id="loanerReturnsPage" class="page-shell loaner-returns-shell">
    <section class="page-section return-phone-hide">
      <h1>Loaners</h1>

      <div class="subtabs">
        <a id="loanerFleetTab" href="/pages/loaner-fleet/loaner-fleet.html" style="display:none">
          Fleet
        </a>

        <a id="loanerManageTab" href="/pages/loaner-fleet/loaner-manage.html" style="display:none">
          Manage Fleet
        </a>

        <a id="loanerFilesTab" href="/pages/loaner-fleet/loaner-files.html" style="display:none">
          Files
        </a>

        <a id="loanerReturnsTab" href="/pages/loaner-returns/loaner-returns.html" class="active" style="display:none">
          Returns
        </a>

        <a id="loanerWashTab" href="/pages/loaner-wash/loaner-wash.html" style="display:none">
          Wash Queue
        </a>
      </div>

      <div id="loanerCounts" class="loaner-counts">
        <div class="loaner-count-card">
          <span class="loaner-count-label">
            Total
          </span>

          <strong id="loanerTotalCount">
            0
          </strong>
        </div>

        <div class="loaner-count-card">
          <span class="loaner-count-label">
            Out
          </span>

          <strong id="loanerOutCount">
            0
          </strong>
        </div>

        <div class="loaner-count-card">
          <span class="loaner-count-label">
            Available
          </span>

          <strong id="loanerAvailableCount">
            0
          </strong>
        </div>

        <div class="loaner-count-card">
          <span class="loaner-count-label">
            At Wash
          </span>

          <strong id="loanerAtWashCount">
            0
          </strong>
        </div>

        <div class="loaner-count-card">
          <span class="loaner-count-label">
            In Shop
          </span>

          <strong id="loanerInShopCount">
            0
          </strong>
        </div>
      </div>
    </section>

    <section class="page-section">
      <div class="dexp-admin-card">
        <h3>Return Intake</h3>

        <div class="return-scan-row">
          <button id="scanReturnBtn" type="button">Scan VIN</button>
          <input id="manualVin" type="search" inputmode="text" enterkeyhint="search" autocomplete="off"
            autocapitalize="characters" placeholder="Full VIN, last 8, or last 6" />
          <button id="findReturnVinBtn" type="button" disabled>Find</button>
        </div>

        <div id="vinRejectMsg" class="vin-reject-msg" role="alert"></div>

        <video id="scannerVideo" autoplay playsinline muted style="display: none"></video>
        <div id="vinTarget" style="display: none">
          <div>Line up the VIN</div>
        </div>

        <div id="scannerStatus" class="small-muted"></div>

        <div id="returnSummary" class="page-message"></div>

        <div class="form-grid" id="fuelEntryWrap" data-mode="range">
          <label>
            VIN
            <input id="vin" readonly />
          </label>
          <label>
            Year
            <input id="year" readonly />
          </label>
          <label>
            Model
            <input id="model" readonly />
          </label>
          <label>
            Returned at
            <input id="returnedAt" readonly />
          </label>
          <label>
            Received by
            <input id="receivedBy" readonly />
          </label>
          <label>
            Miles
            <input id="mileage" type="number" inputmode="numeric" min="0" />
          </label>
          <label>
            Range or fuel
            <span class="fuel-row">
              <span class="fuel-mode-toggle">
                <button id="fuelModeFuelBtn" type="button">Fuel</button>
                <button id="fuelModeRangeBtn" type="button">Range</button>
              </span>
              <span class="fuel-level">
                <select id="fuelTankSelect">
                  <option value="">Fuel level</option>
                  <option value="Full">Full</option>
                  <option value="3/4">3/4</option>
                  <option value="Half">Half</option>
                  <option value="1/4">1/4</option>
                  <option value="Empty">Empty</option>
                </select>
                <input id="fuelLevel" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done"
                  autocomplete="off" placeholder="Range (mi)" />
              </span>
            </span>
          </label>
          <label>
            Where it goes
            <select id="returnDestination">
              <option value="At Wash" selected>Send to Wash</option>
              <option value="Available">Available (no wash)</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Damage
            <span class="damage-toggle">
              <button type="button" id="damageNoBtn">No</button>
              <button type="button" id="damageYesBtn">Yes</button>
            </span>
            <input id="damageYesNo" type="hidden" />
          </label>
          <label id="damageNotesLabel" style="display:none">
            Damage notes
            <textarea id="damageNotes" placeholder="Required if Yes"></textarea>
          </label>
        </div>

        <div id="damagePhotoBox" style="display:none">
          <input id="damagePhotoInput" type="file" accept="image/*" capture="environment" hidden />
          <button id="damagePhotoBtn" type="button">Take picture</button>
          <div id="damagePhotoThumbs" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
          <div id="damagePhotoCount" class="small-muted"></div>
        </div>

        <p id="retireReturnBanner" class="tool-help" style="display:none">
          This unit is flagged Retire on return. Check-in will not send it to wash.
        </p>

        <div class="action-row">
          <button id="saveReturnBtn" type="button" disabled>
            Save Return
          </button>
        </div>

        <div id="returnMsg" class="page-message"></div>
      </div>
    </section>

    <section class="page-section">
      <div class="dexp-admin-card">
        <h3>Return List</h3>
        <label>
          Day
          <input id="returnDay" type="date" />
        </label>
        <div class="table-wrap" id="returnTable"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/modules/loaners/loaner-returns-page.js?v=22"></script>
</body>

</html>
