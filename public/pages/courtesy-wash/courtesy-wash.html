<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Courtesy Wash</title>

  <link
    rel="stylesheet"
    href="/css/core/reset.css"
  />

  <link
    rel="stylesheet"
    href="/css/core/base.css"
  />
</head>

<body>
  <div id="appHeader"></div>

  <main class="page-shell">

    <section class="page-section">
      <h1>Courtesy Wash</h1>

      <p>
        Scan the vehicle VIN, enter the customer information,
        and send the vehicle to the wash queue.
      </p>
    </section>

    <section class="page-section">

      <h2>Vehicle</h2>

      <div class="form-row">

        <button
          id="scanVinBtn"
          type="button"
        >
          Scan VIN
        </button>

        <input
          id="vin"
          type="text"
          maxlength="17"
          placeholder="VIN"
          autocomplete="off"
        />

      </div>

      <video
        id="scannerVideo"
        playsinline
        muted
        style="display:none;"
      ></video>

      <div
        id="scannerStatus"
        class="small-muted"
      ></div>

      <div
        class="form-row"
        style="margin-top:12px;"
      >

        <input
          id="year"
          type="text"
          placeholder="Year"
          readonly
        />

        <input
          id="make"
          type="text"
          placeholder="Make"
          readonly
        />

        <input
          id="model"
          type="text"
          placeholder="Model"
          readonly
        />

      </div>

    </section>

    <section class="page-section">

      <h2>Customer</h2>

      <div class="form-row">

        <input
          id="customerName"
          type="text"
          placeholder="Customer Name"
          autocomplete="name"
        />

        <input
          id="customerPhone"
          type="tel"
          placeholder="Phone Number"
          autocomplete="tel"
        />

      </div>

    </section>

    <section
      id="estimateSection"
      class="page-section"
      style="display:none;"
    >

      <h2>Estimated Completion</h2>

      <p>
        Vehicles currently ahead:
        <strong id="vehiclesAhead"></strong>
      </p>

      <p>
        Possible completion time:
        <strong id="estimatedCompletion"></strong>
      </p>

    </section>

    <section class="page-section">

      <button
        id="sendBtn"
        type="button"
        disabled
      >
        Send to Wash
      </button>

      <div
        id="msg"
        class="small-muted"
        style="margin-top:10px;"
      ></div>

    </section>

  </main>

  <script
    type="module"
    src="/js/modules/wash/courtesy-wash-page.js"
  ></script>
</body>
</html>
