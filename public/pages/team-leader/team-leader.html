<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="/css/core/reset.css" />

  </head>
  <body>
    <div id="appHeader"></div>
    <main class="foreman-shell">
      <section class="page-section">
        <h1>Team leader</h1>

        <div class="foreman-tabs" id="leaderViews">

            <thead>
              <tr>
                <th>RO</th>
                <th>Tag</th>
                <th>Vehicle</th>
                <th>Advisor</th>
                <th>Tech</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="teamTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/js/modules/foreman/team-leader-page.js?v=1"></script>
