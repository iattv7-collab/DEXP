<!-- FILE: /public/pages/send-to-wash/send-to-wash.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Send to Wash</title>

  <link rel="stylesheet" href="/css/core/reset.css" />
  <link rel="stylesheet" href="/css/core/base.css" />
</head>

<body>
  <div id="appHeader"></div>

  <main class="page-shell">
    <section class="page-section">
      <div class="dexp-admin-card">
      <h1>Send to Wash</h1>
      <p></p>

    <section class="page-section">
      <h2>Find RO and Send to Wash</h2>

      <div class="form-row">
        <input id="searchInput" placeholder="Enter RO # or Tag #" />
        <button id="findBtn" type="button">Find Ticket</button>
      </div>

      <div id="previewCard" class="page-section" style="display:none; margin-top:14px;">
        <h2>Ticket Preview</h2>

        <p><b>RO:</b> <span id="pRo"></span></p>
        <p><b>Tag:</b> <span id="pTag"></span></p>
        <p><b>Model:</b> <span id="pModel"></span></p>
        <p><b>Current Wash Status:</b> <span id="pWashStatus"></span></p>
        <p><b>Location:</b> <span id="pLocation"></span></p>
        <p><b>Waiter:</b> <span id="pWaiter"></span></p>

        <textarea id="notes" rows="3" placeholder="Anything wash team should know..."></textarea>

        <div id="alreadyInWashMsg" style="display:none; margin-top:10px; color:crimson;">
          This vehicle is already in the wash flow and cannot be sent again.
        </div>

        <div style="margin-top:14px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="keyAlreadyAtWashCheck" />
            Key already at wash
          </label>
        </div>

        <button id="updateLocationBtn" type="button" style="margin-top:12px; width:100%;">Update location</button>

        <div id="locationPanel" style="display:none; margin-top:10px;">
          <label>Area<br>
            <select id="locationAreaSelect" style="min-width:220px; margin-top:4px;">
              <option value="">Select area...</option>
            </select>
          </label>
          <br>
          <label style="margin-top:8px; display:inline-block;">Lot<br>
            <select id="locationLotSelect" style="min-width:220px; margin-top:4px;">
              <option value="">Select lot...</option>
            </select>
          </label>
          <br>
          <label style="margin-top:8px; display:inline-block;">Blocking Tag<br>
            <input id="locationBlockingInput" type="text" placeholder="Tag this car is blocking" style="min-width:220px; margin-top:4px;" />
          </label>
        </div>

        <button id="saveBtn" type="button" style="margin-top:14px;">Save</button>

        <div id="finishActions" style="display:none; margin-top:14px;">
          <button id="finishBtn" type="button" style="width:100%;">Finish — key at wash</button>
          <button id="cancelBtn" type="button" style="margin-top:10px; width:100%;">Cancel</button>
        </div>
      </div>

      <div id="msg" class="small-muted"></div>

      <div class="action-row" style="justify-content:flex-end; margin-top:16px;">
        <button type="button" onclick="location.href='/pages/dashboard/index.html'">Back</button>
      </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/modules/wash/send-to-wash-page.js?v=13"></script>
</body>
</html>
