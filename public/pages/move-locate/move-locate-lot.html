<!-- public/pages/move-locate/move-locate-lot.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lot</title>
  <link rel="stylesheet" href="/css/core/base.css" />
  <link rel="stylesheet" href="/css/modules/move-locate.css?v=12" />
</head>
<body>
  <main id="moveLocatePage" class="full-page">
    <section class="page-shell full-page">
      <section id="lotTagListPanel" class="tool-card">
        <div class="lot-list-header">
          <h3 id="lotTagListTitle">Lot</h3>
          <button id="lotTagListBack" type="button" class="small-button secondary">Back</button>
        </div>
        <input id="lotTagSearchInput" type="search" placeholder="Search tag" />
        <p class="tool-help">Double-tap a row to update location.</p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Tag</th>
                <th>Location</th>
                <th>Blocking</th>
              </tr>
            </thead>
            <tbody id="lotTagListBody"></tbody>
          </table>
        </div>
      </section>

      <section id="lotUpdatePanel" class="tool-card hidden">
        <div class="lot-list-header">
          <h3>Update location</h3>
          <button id="lotUpdateBack" type="button" class="small-button secondary">Back</button>
        </div>
        <p id="lotUpdateVehicleLine" class="tool-help"></p>
        <label>
          Area
          <select id="lotUpdateAreaSelect">
            <option value="">Select area...</option>
          </select>
        </label>
        <label>
          Lot
          <select id="lotUpdateLotSelect">
            <option value="">Select lot...</option>
          </select>
        </label>
        <label>
          Blocking Tag
          <input id="lotUpdateBlockingInput" type="text" placeholder="Tag this car is blocking" />
        </label>
        <button id="lotUpdateSaveButton" type="button" disabled>Save location</button>
        <p id="lotUpdateMessage" class="tool-message"></p>
      </section>
    </section>
  </main>
  <script type="module" src="/js/core/app.js"></script>
  <script type="module" src="/pages/move-locate/move-locate-lot-page.js?v=5"></script>
</body>
</html>
